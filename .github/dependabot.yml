version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nx:
        patterns:
          - "nx"
          - "@nx/*"
      oxlint:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      graphql-codegen:
        patterns:
          - "@graphql-codegen/*"
      typescript:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "@types/*"
    ignore:
      # @types/node is pinned via pnpm catalog; Dependabot cannot update catalog entries correctly
      - dependency-name: "@types/node"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
