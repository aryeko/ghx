query ProjectV2ItemsList($owner: String!, $projectNumber: Int!, $first: Int!, $after: String) {
  repositoryOwner(login: $owner) {
    ... on ProjectV2Owner {
      projectV2(number: $projectNumber) {
        items(first: $first, after: $after) {
          nodes {
            id
            type
            content {
              ... on Issue {
                number
                title
              }
              ... on PullRequest {
                number
                title
              }
              ... on DraftIssue {
                title
              }
            }
          }
          pageInfo {
            ...PageInfoFields
          }
        }
      }
    }
  }
}
