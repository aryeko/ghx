capability_id: pr.stack.add
version: "1.0.0"
description: Append existing open pull requests to the top of a native GitHub stack.
input_schema:
  type: object
  required: [owner, name, stackNumber, expectedTopPrNumber, prNumbers]
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]+$" }
    name: { type: string, pattern: "^(?![.]{1,2}$)[A-Za-z0-9_.-]+$" }
    stackNumber: { type: integer, minimum: 1, maximum: 9007199254740991 }
    expectedTopPrNumber:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Current top PR number observed by the caller.
    prNumbers:
      type: array
      description: New PR numbers starting immediately above the current top.
      minItems: 1
      uniqueItems: true
      items: { type: integer, minimum: 1, maximum: 9007199254740991 }
  additionalProperties: false
output_schema:
  type: object
  required: [stackNumber, baseRefName, open, members]
  properties:
    stackNumber: { type: integer, minimum: 1 }
    baseRefName: { type: string }
    open: { type: boolean }
    members:
      type: array
      items:
        type: object
        required: [prNumber, position, headRefName, headSha, baseRefName, state, isDraft]
        properties:
          prNumber: { type: integer, minimum: 1 }
          position: { type: integer, minimum: 1 }
          headRefName: { type: string }
          headSha: { type: string }
          baseRefName: { type: string }
          state: { type: string, enum: [OPEN, CLOSED, MERGED] }
          isDraft: { type: boolean }
        additionalProperties: false
  additionalProperties: false
routing:
  preferred: rest
  fallbacks: []
  notes:
    - GitHub.com only. Run as a single capability.
    - If the submission outcome is unknown, read remote state before submitting again.
    - GitHub validates the append against current state. The expected top is checked before submission.
rest:
  endpoints:
    - { method: POST, path: "/repos/{owner}/{repo}/stacks/{stack_number}/add" }
