capability_id: pr.stack.list
version: "1.0.0"
description: List native GitHub pull request stacks, optionally filtered by pull request.
input_schema:
  type: object
  required: [owner, name]
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]+$" }
    name: { type: string, pattern: "^(?![.]{1,2}$)[A-Za-z0-9_.-]+$" }
    prNumber: { type: integer, minimum: 1, maximum: 9007199254740991 }
    first: { type: integer, minimum: 1, maximum: 100, default: 30 }
    after: { type: [string, "null"], minLength: 1, maxLength: 2048 }
  additionalProperties: false
output_schema:
  type: object
  required: [items, pageInfo]
  properties:
    items:
      type: array
      items:
        type: object
        required: [stackNumber, baseRefName, open, prNumbers]
        properties:
          stackNumber: { type: integer, minimum: 1 }
          baseRefName: { type: string }
          open: { type: boolean }
          prNumbers: { type: array, items: { type: integer, minimum: 1 } }
        additionalProperties: false
    pageInfo:
      type: object
      required: [hasNextPage, endCursor]
      properties:
        hasNextPage: { type: boolean }
        endCursor: { type: [string, "null"] }
      additionalProperties: false
  additionalProperties: false
routing:
  preferred: rest
  fallbacks: []
  notes:
    - GitHub.com only. A successful empty result means no matching stack was returned.
rest:
  endpoints:
    - { method: GET, path: "/repos/{owner}/{repo}/stacks" }
