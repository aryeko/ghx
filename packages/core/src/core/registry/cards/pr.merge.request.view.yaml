capability_id: pr.merge.request.view
version: "1.0.0"
description: Read the current result of a GitHub asynchronous pull request merge.
input_schema:
  type: object
  required: [owner, name, prNumber, requestId]
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]+$" }
    name: { type: string, pattern: "^(?![.]{1,2}$)[A-Za-z0-9_.-]+$" }
    prNumber: { type: integer, minimum: 1, maximum: 9007199254740991 }
    requestId: { type: string, pattern: "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$" }
  additionalProperties: false
output_schema:
  type: object
  required: [status, requestId]
  properties:
    status: { type: string, enum: [pending, merged, enqueued, failed] }
    requestId: { type: string }
    mergeCommitSha: { type: string }
    message: { type: string }
    mergeAction: { type: string, enum: [default, direct_merge, merge_queue] }
    method: { type: string, enum: [default, merge, squash, rebase] }
    expectedHeadSha: { type: string }
    bypassRules: { type: boolean }
  additionalProperties: false
routing:
  preferred: rest
  fallbacks: []
  notes:
    - GitHub.com only. GitHub retains a result for 24 hours after its most recent update.
    - Stop polling on merged, enqueued, or failed. For eventual queue outcomes or expired requests, check PR state with pr.view.
rest:
  endpoints:
    - { method: GET, path: "/repos/{owner}/{repo}/pulls/{pull_number}/merge-async/{uuid}" }
