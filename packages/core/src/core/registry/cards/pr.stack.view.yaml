capability_id: pr.stack.view
version: "1.0.0"
description: Fetch a native GitHub pull request stack by its stack number.
input_schema:
  type: object
  required: [owner, name, stackNumber]
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]+$" }
    name: { type: string, pattern: "^(?![.]{1,2}$)[A-Za-z0-9_.-]+$" }
    stackNumber: { type: integer, minimum: 1, maximum: 9007199254740991 }
  additionalProperties: false
output_schema:
  type: object
  required: [stackNumber, baseRefName, open, members]
  properties:
    stackNumber: { type: integer, minimum: 1 }
    baseRefName: { type: string }
    open: { type: boolean }
    members:
      type: array
      items:
        type: object
        required: [prNumber, position, headRefName, headSha, baseRefName, state, isDraft]
        properties:
          prNumber: { type: integer, minimum: 1 }
          position: { type: integer, minimum: 1 }
          headRefName: { type: string }
          headSha: { type: string }
          baseRefName: { type: string }
          state: { type: string, enum: [OPEN, CLOSED, MERGED] }
          isDraft: { type: boolean }
        additionalProperties: false
  additionalProperties: false
routing:
  preferred: rest
  fallbacks: []
  notes:
    - GitHub.com only. Members are returned bottom to top.
rest:
  endpoints:
    - { method: GET, path: "/repos/{owner}/{repo}/stacks/{stack_number}" }
