capability_id: pr.stack.status
version: "1.0.0"
description: Show layer review and CI signals and preview a native GitHub stack merge.
input_schema:
  type: object
  required: [owner, name, stackNumber]
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]+$" }
    name: { type: string, pattern: "^(?![.]{1,2}$)[A-Za-z0-9_.-]+$" }
    stackNumber: { type: integer, minimum: 1, maximum: 9007199254740991 }
    throughPrNumber: { type: integer, minimum: 1, maximum: 9007199254740991 }
  additionalProperties: false
output_schema:
  type: object
  required: [stackNumber, baseRefName, open, snapshotStatus, members, mergePreview]
  properties:
    stackNumber: { type: integer, minimum: 1 }
    baseRefName: { type: string }
    open: { type: boolean }
    snapshotStatus: { type: string, enum: [current, stale] }
    members:
      type: array
      items:
        type: object
        required:
          - prNumber
          - position
          - headRefName
          - headSha
          - baseRefName
          - state
          - isDraft
          - reviewDecision
          - mergeStateStatus
          - checksState
          - signalsAvailable
        properties:
          prNumber: { type: integer, minimum: 1 }
          position: { type: integer, minimum: 1 }
          headRefName: { type: string }
          headSha: { type: string }
          baseRefName: { type: string }
          state: { type: string, enum: [OPEN, CLOSED, MERGED] }
          isDraft: { type: boolean }
          reviewDecision: { type: [string, "null"] }
          mergeStateStatus: { type: [string, "null"] }
          checksState: { type: [string, "null"] }
          signalsAvailable: { type: boolean }
        additionalProperties: false
    mergePreview:
      type: [object, "null"]
      required: [stackNumber, throughPrNumber, expectedBaseRefName, expectedMembers]
      properties:
        stackNumber: { type: integer, minimum: 1 }
        throughPrNumber: { type: integer, minimum: 1 }
        expectedBaseRefName: { type: string }
        expectedMembers:
          type: array
          items:
            type: object
            required: [prNumber, headSha]
            properties:
              prNumber: { type: integer, minimum: 1 }
              headSha: { type: string }
            additionalProperties: false
      additionalProperties: false
  additionalProperties: false
routing:
  preferred: rest
  fallbacks: []
  notes:
    - GitHub.com only. Review and check signals are advisory.
    - A preview describes the observed prefix and does not submit a merge.
rest:
  endpoints:
    - { method: GET, path: "/repos/{owner}/{repo}/stacks/{stack_number}" }
