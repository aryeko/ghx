packages:
  - packages/*

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  lefthook: true
  nx: true

catalog:
  "@types/node": ^26.6.6
  # TS7 supplies tsc; the separate TS6 alias supplies the programmatic API.
  "@typescript/native": "npm:typescript@^7.0.2"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  tsup: ^9.0.0
  tsx: ^4.23.15
  vitest: ^5.1.1
  "@vitest/coverage-v8": ^5.1.1

strictPeerDependencies: true
autoInstallPeers: false

# Nx and graphql-config still depend on vulnerable minimatch majors.
# GHSA-g3hv-75wg-m249; remove once their supported ranges include the fix.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "11.0.9"
patchedDependencies:
  nx@24.0.6: patches/nx@24.0.6.patch
